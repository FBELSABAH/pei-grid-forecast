[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pei-grid-forecast"
version = "1.1.0"
description = "Auditable day-ahead PEI electricity-demand forecasting"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "requests>=2.32,<3", "matplotlib>=3.9,<4", "joblib>=1.4,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
report = ["reportlab>=4,<6", "pypdf>=5,<8"]

[tool.setuptools.packages.find]
include = ["gridcast*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
